name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/check-production-cors.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'api/**'
      - '.dockerignore'
      - 'Makefile'
      - 'scripts/check-production-cors.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: tmpfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.0

    - name: Install latest stable Rust
      run: |
        rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
        rustc +stable --version
        cargo +stable --version

    - name: Install nginx for deployment checks
      run: |
        sudo apt-get update
        sudo apt-get install --yes nginx

    - name: Check formatting
      run: make fmt-check

    - name: Run tests
      run: make test

    - name: Run Redis contract test
      env:
        TEST_REDIS_ADDR: 127.0.0.1:6379
      run: cd api && cargo +stable test --locked redis_store_contract -- --ignored

    - name: Run Clippy
      run: make clippy-ci

    - name: Validate Pages/API surface contract
      run: make pages-check

    - name: Validate nginx syntax and CORS behavior
      run: make nginx-check

    - name: Audit Rust dependencies
      uses: rustsec/audit-check@v2.0.0
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        working-directory: api

  build:
    name: Build Job
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7.0.0

    - name: Docker Hub Login
      uses: docker/login-action@v4.4.0
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    - name: Get current date
      run: echo "CI_DATE=$(date +'%F')" >> "$GITHUB_ENV"

    - name: Get branch name
      run: echo "BRANCH_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

    - name: Get repo name
      run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

    - name: Docker build and push
      uses: docker/build-push-action@v7.3.0
      with:
        context: .
        file: ./api/Dockerfile
        pull: true
        push: true
        platforms: linux/amd64
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.BRANCH_NAME }}-rust
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.BRANCH_NAME }}-${{ env.CI_DATE }}-rust
          ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.REPO_NAME }}:rust
  deploy:
    name: Deploy Job
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout deployment checks
      uses: actions/checkout@v7.0.0

    - name: Verify production nginx CORS is active
      env:
        TMPFILE_PAGES_ORIGIN: ${{ vars.TMPFILE_PAGES_ORIGIN }}
      run: ./scripts/check-production-cors.sh https://dl.xabcnews.com/upload "$TMPFILE_PAGES_ORIGIN"

    - name: Get repo name
      run: echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ywgx
        key: ${{ secrets.PROD_KEY }}
        script: |
          set -e
          cd /home/ywgx/1/${{ env.REPO_NAME }}
          docker-compose -f docker-compose.yml pull
          docker-compose -f docker-compose.yml up -d
          docker image prune --all --force
          docker system prune -a -f

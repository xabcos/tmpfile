[package]
name = "tmpfile"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["multipart"] }
futures-util = { version = "0.3.32", default-features = false, features = ["async-await", "std"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "sync"] }
tokio-util = { version = "0.7.18", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
chrono = "0.4.44"
redis = { version = "1.0.4", features = ["tokio-comp", "connection-manager", "aio", "script"] }
rand = "0.10.0"
async-trait = "0.1.89"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true
